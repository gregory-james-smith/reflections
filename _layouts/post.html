---
layout: default
---

<div
  class="flex flex-row flex-justify-center flex-contents-start flex-items-start gap-8"
>
  {% include posts-aside.html %}

  <article class="
    flex-1 max-w-none
    prose prose-zinc
    prose-p:leading-normal
    prose-img:rounded-lg
    prose-h1:tracking-tight prose-h1:font-semibold
    prose-h2:tracking-snug prose-h2:font-semibold
    prose-a:text-sky-600 prose-a:underline-offset-2
    prose-code:bg-zinc-500/10 prose-code:border-1 prose-code:rounded-md prose-code:p-1 prose-code:py-0.5
    prose-code:text-zinc-700 prose-code:font-normal
    prose-code:[&::before]:content-none
    prose-code:[&::after]:content-none
    prose-blockquote:font-serif
    prose-blockquote:font-normal
    prose-blockquote:not-italic
    prose-blockquote:[&>p::before]:content-none
    prose-blockquote:[&>prose-p::before]:content-none
    prose-blockquote:[&::after]:content-none
  ">
    <h1 class="mt-0 mb-6">{{ page.title }}</h1>
    <div
      class="border-y border-subtle flex flex-row flex-justify-start contents-center items-center gap-4 text-sm padding-y-2"
    >
      <p class="margin-0">{{ page.date | date: "%-d %B %Y" }}</p>
      <p class="margin-0">{{ page.author }}</p>
    </div>

    {{ content }}
  </article>
</div>
