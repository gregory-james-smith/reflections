---
layout: default
---

<article class="prose prose-slate max-w-none">
  <div class="rounded-3xl border border-slate-200 bg-white p-8 shadow-sm sm:p-10">
    <p class="text-sm font-semibold uppercase tracking-[0.3em] text-brand-700">{{ page.date | date: "%B %-d, %Y" }}</p>
    <h1 class="mt-2 text-3xl font-semibold text-slate-900">{{ page.title }}</h1>
    <div class="mt-8 leading-8 text-slate-700">
      {{ content }}
    </div>
  </div>
</article>
