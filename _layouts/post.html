---
layout: default
---

<div
  class="flex flex-row flex-justify-center flex-contents-start flex-items-start gap-8"
>
  {% include posts-aside.html %}

  <article class="flex-1 max-w-none prose prose-zinc prose-img:rounded-lg prose-h1:tracking-tight prose-h1:font-semibold prose-h2:font-semibold prose-a:text-sky-600 prose-a:underline-offset-2 prose-h1:margin-top-12">
    <h1 class="mt-0 mb-6">{{ page.title }}</h1>
    <div
      class="border-y border-subtle flex flex-row flex-justify-start contents-center items-center gap-4 text-sm padding-y-2"
    >
      <p class="margin-0">{{ page.date | date: "%B %-d, %Y" }}</p>
      <p class="margin-0">{{ page.author }}</p>
    </div>

    {{ content }}
  </article>
</div>
