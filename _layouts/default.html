<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title }} — {{ site.title }}</title>

    <!-- Tailwind -->
    <link
      href="{{ '/assets/css/tailwind-output.css' | relative_url }}"
      rel="stylesheet"
    />

    <!-- Apple-style system font stack -->
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial,
          sans-serif;
      }
    </style>
  </head>

  <body class="surface-raised antialiased">
    {% include nav.html %}

    <main class="max-w-screen-xl mx-auto px-6 lg:px-12 py-12">
      {{ content }}
    </main>

    {% include footer.html %}
  </body>
</html>
